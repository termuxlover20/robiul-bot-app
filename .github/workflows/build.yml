name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Setup Android SDK and Accept All Licenses
      run: |
        sudo apt-get update -y
        sudo apt-get install -y -qq libssl-dev libffi-dev python3-dev openjdk-17-jdk
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # Automatically accept all sdkmanager licenses
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build with Buildozer
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # Pass yes to buildozer prompts explicitly
        printf 'y\ny\ny\ny\ny\n' | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RobiulBot-APK
        path: bin/*.apk
